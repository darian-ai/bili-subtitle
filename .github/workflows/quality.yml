name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Sync locked environment
        run: uv sync --locked --dev
      - name: Run tests
        run: uv run pytest
      - name: Verify dependency license audit
        run: uv run python scripts/verify_licenses.py
      - name: Run Ruff lint
        run: uv run ruff check .
      - name: Check Ruff formatting
        run: uv run ruff format --check .
      - name: Run Pyright
        run: uv run pyright
      - name: Build release archives
        run: uv build
      - name: Verify release archives
        run: uv run python scripts/verify_release.py dist --rebuild-sdist
      - name: Verify isolated uv tool install
        shell: pwsh
        run: ./scripts/verify_isolated_install.ps1 -Wheel ./dist/bili_study-0.1.1-py3-none-any.whl
