[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "bili-study"
version = "0.2.0.dev1"
description = "基于 Bilibili 站内字幕的本地优先视频学习 CLI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1",
    "httpx>=0.28",
    "keyring>=25.6",
    "qrcode>=8.2",
    "rich>=14.0",
    "typer>=0.16",
    "uvicorn>=0.35,<1",
]

[project.scripts]
bili-study = "bili_study.cli:main"
bili-subtitle = "bili_subtitle.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "pytest-timeout>=2.4",
    "respx>=0.22",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bili_subtitle", "src/bili_study"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
    "/src/bili_subtitle",
    "/src/bili_study",
    "/specs/adrs",
    "/specs/licenses",
    "/specs/mission.md",
    "/specs/tech-stack.md",
    "/specs/roadmap.md",
]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=bili_subtitle",
    "--cov=bili_study",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
