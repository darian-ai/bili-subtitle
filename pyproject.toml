[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "bili-subtitle"
version = "0.1.0"
description = "提取 Bilibili 站内已有字幕的 Windows 优先 CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "keyring>=25.6",
    "qrcode>=8.2",
    "rich>=14.0",
    "typer>=0.16",
]

[project.scripts]
bili-subtitle = "bili_subtitle.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.403",
    "pytest>=8.4",
    "pytest-cov>=6.2",
    "respx>=0.22",
    "ruff>=0.12",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bili_subtitle"]

[tool.hatch.build.targets.sdist]
include = [
    "/README.md",
    "/pyproject.toml",
    "/src/bili_subtitle",
    "/specs/mission.md",
    "/specs/tech-stack.md",
    "/specs/roadmap.md",
]

[tool.pytest.ini_options]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--cov=bili_subtitle",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=90",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
